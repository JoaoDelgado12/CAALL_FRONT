name: CI Frontend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
